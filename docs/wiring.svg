<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13">
  <title>Wiring: ESP32 – MAX485 – JK-PB, ESP32 – SN65HVD230 – Flatpack2</title>
  <defs>
    <marker id="rx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7B4FD6"/></marker>
    <marker id="tx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0E8FA3"/></marker>
    <style>
      .box{fill:#F7F9FA;stroke:#5C6875;stroke-width:1.5}
      .mod{fill:#EAF1F8;stroke:#5C6875;stroke-width:1.5}
      .ext{fill:#FFF7EC;stroke:#A15E0B;stroke-width:1.5}
      .t{fill:#17212B}
      .h{fill:#17212B;font-weight:650;font-size:14.5px}
      .m{fill:#5C6875;font-size:12px}
      .w{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .dot{stroke:none}
    </style>
  </defs>
  <rect x="1" y="1" width="978" height="598" rx="14" fill="#FFFFFF" stroke="#D5DBE1"/>

  <!-- ESP32 -->
  <rect class="box" x="40" y="70" width="210" height="430" rx="10"/>
  <text class="h" x="56" y="98">ESP32 DevKit</text>
  <text class="m" x="56" y="116">WROOM-32D, 38-pin</text>
  <g class="t" text-anchor="end">
    <text x="238" y="144">GPIO16 (RX2)</text>
    <text x="238" y="179">GPIO17 (TX2)</text>
    <text x="238" y="214">GPIO23</text>
    <text x="238" y="264">3V3</text>
    <text x="238" y="299">GND</text>
    <text x="238" y="429">GPIO19</text>
    <text x="238" y="459">GPIO18</text>
  </g>
  <rect x="120" y="500" width="50" height="22" rx="4" fill="#D5DBE1" stroke="#5C6875"/>
  <text class="m" x="145" y="542" text-anchor="middle">USB 5 V</text>

  <!-- MAX485 -->
  <rect class="mod" x="430" y="100" width="170" height="215" rx="10"/>
  <text class="h" x="515" y="128" text-anchor="middle">MAX485</text>
  <text class="m" x="515" y="146" text-anchor="middle">RS485 module</text>
  <g class="t">
    <text x="442" y="144" font-size="12">RO</text>
    <text x="442" y="179" font-size="12">DI</text>
    <text x="442" y="214" font-size="12">DE</text>
    <text x="442" y="239" font-size="12">RE</text>
    <text x="442" y="264" font-size="12">VCC</text>
    <text x="442" y="299" font-size="12">GND</text>
  </g>
  <g class="t" text-anchor="end">
    <text x="588" y="194">A</text>
    <text x="588" y="254">B</text>
  </g>

  <!-- SN65HVD230 -->
  <rect class="mod" x="430" y="345" width="170" height="135" rx="10"/>
  <text class="h" x="525" y="410" text-anchor="middle">SN65</text>
  <text class="h" x="525" y="428" text-anchor="middle">HVD230</text>
  <text class="m" x="525" y="446" text-anchor="middle">CAN</text>
  <g class="t" font-size="12">
    <text x="442" y="374">GND</text>
    <text x="442" y="399">3V3</text>
    <text x="442" y="429">CTX</text>
    <text x="442" y="459">CRX</text>
  </g>
  <g class="t" text-anchor="end" font-size="12">
    <text x="588" y="399">CANH</text>
    <text x="588" y="449">CANL</text>
  </g>

  <!-- JK-PB -->
  <rect class="ext" x="740" y="100" width="210" height="215" rx="10"/>
  <text class="h" x="756" y="128">JK-PB BMS</text>
  <text class="m" x="756" y="146">port RS485-2 "Parallel", RJ45</text>
  <g class="t">
    <text x="756" y="194">A · pins 2 + 7</text>
    <text x="756" y="254">B · pins 1 + 8</text>
  </g>
  <text class="m" x="756" y="286">GND · pins 3 + 6:</text>
  <text class="m" x="756" y="302">not connected</text>

  <!-- Flatpack2 -->
  <rect class="ext" x="740" y="345" width="210" height="135" rx="10"/>
  <text class="h" x="756" y="372">Eltek Flatpack2</text>
  <g class="t">
    <text x="772" y="399">CAN H</text>
    <text x="772" y="449">CAN L</text>
  </g>
  <text class="m" x="756" y="470">±48 V: power only, never to ESP32</text>

  <!-- wires: RS485 side -->
  <path class="w" stroke="#7B4FD6" marker-end="url(#rx)" d="M430 140H252"/>
  <path class="w" stroke="#0E8FA3" marker-end="url(#tx)" d="M250 175H428"/>
  <path class="w" stroke="#9B6B2F" d="M250 210H415V235H430M415 210H430"/>
  <circle class="dot" cx="415" cy="210" r="4" fill="#9B6B2F"/>
  <text class="m" x="300" y="203">DE + RE bridged</text>
  <path class="w" stroke="#E07B00" d="M600 190H740"/>
  <path class="w" stroke="#1F6FD1" d="M600 250H740"/>

  <!-- power: 3V3 to MAX485 VCC and SN65 3V3 (hop over GND) -->
  <path class="w" stroke="#D7263D" d="M250 260H430M290 260V289A6 6 0 0 1 290 301V395H430"/>
  <circle class="dot" cx="290" cy="260" r="4" fill="#D7263D"/>
  <path class="w" stroke="#222222" d="M250 295H430M330 295V370H430"/>
  <circle class="dot" cx="330" cy="295" r="4" fill="#222222"/>

  <!-- wires: CAN side -->
  <path class="w" stroke="#0E8FA3" marker-end="url(#tx)" d="M250 425H428"/>
  <path class="w" stroke="#7B4FD6" marker-end="url(#rx)" d="M430 455H252"/>
  <path class="w" stroke="#C99700" d="M600 395H740"/>
  <path class="w" stroke="#2E9E4F" d="M600 445H740"/>
  <!-- 120 ohm at each end -->
  <g stroke="#17212B" stroke-width="1.6" fill="#FFFFFF">
    <path d="M630 395V407M630 433V445" fill="none"/><rect x="624" y="407" width="12" height="26" rx="2"/>
    <path d="M712 395V407M712 433V445" fill="none"/><rect x="706" y="407" width="12" height="26" rx="2"/>
  </g>
  <g class="dot"><circle cx="630" cy="395" r="3.5" fill="#C99700"/><circle cx="630" cy="445" r="3.5" fill="#2E9E4F"/><circle cx="712" cy="395" r="3.5" fill="#C99700"/><circle cx="712" cy="445" r="3.5" fill="#2E9E4F"/></g>
  <text class="m" x="671" y="475" text-anchor="middle">120 Ω at each end</text>
  <text class="m" x="671" y="491" text-anchor="middle">twisted pair</text>

  <!-- legend -->
  <g font-size="12" class="t" transform="translate(300 528)">
    <path class="w" stroke="#D7263D" d="M0 0H22"/><text x="28" y="4">3.3 V</text>
    <path class="w" stroke="#222222" d="M80 0H102"/><text x="108" y="4">GND</text>
    <path class="w" stroke="#0E8FA3" d="M160 0H182"/><text x="188" y="4">ESP TX</text>
    <path class="w" stroke="#7B4FD6" d="M250 0H272"/><text x="278" y="4">ESP RX</text>
    <path class="w" stroke="#E07B00" d="M340 0H362"/><text x="368" y="4">A</text>
    <path class="w" stroke="#1F6FD1" d="M390 0H412"/><text x="418" y="4">B</text>
    <path class="w" stroke="#C99700" d="M440 0H462"/><text x="468" y="4">CAN H</text>
    <path class="w" stroke="#2E9E4F" d="M520 0H542"/><text x="548" y="4">CAN L</text>
  </g>
  <rect x="300" y="548" width="650" height="38" rx="8" fill="#F7E0E0"/>
  <text x="314" y="564" font-size="12" fill="#17212B" font-weight="600">Only A/B to the BMS, only CAN H/L to the Flatpack. Never ESP32 GND to B−, P− or −48 V.</text>
  <text x="314" y="580" font-size="12" fill="#17212B">До BMS лише A/B, до Flatpack лише CAN H/L. Ніколи не з'єднуйте GND ESP32 з B−, P− чи −48 В.</text>
</svg>
